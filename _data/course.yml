introduction: 在数字经济环境中，消费者、企业、商品和平台之间形成了复杂的关系网络。传统数据分析方法主要关注个体及其属性，而网络分析与图机器学习进一步利用个体之间的关联信息，帮助理解数字商业系统的结构、行为与演化。
positioning: 本课程面向经济管理类本科生，介绍复杂网络的基本概念、经典网络分析算法以及图机器学习方法。课程结合社交媒体、电子商务、组织管理、金融交易和推荐系统等应用场景，通过理论讲授与
  Python 实验，培养学生利用网络数据分析商业问题的能力。课程强调方法理解、数据分析与商业应用，不要求学生具备高级数学或深度学习模型开发经验。
objectives:
- 将实际商业问题转化为网络分析问题。
- 使用 Python 构建和可视化关系网络。
- 计算并解释网络结构、中心性和社区特征。
- 理解网络传播机制及其商业应用。
- 使用传统图算法进行关系预测。
- 理解节点嵌入和图神经网络的基本原理。
- 使用图机器学习方法解决分类与推荐问题。
- 评价模型表现并解释其管理含义。
prerequisites:
- Python 程序设计基础
- 基础概率与统计学
- 基础线性代数
prerequisite_note: 不要求提前学习深度学习、PyTorch 或图神经网络。
modules:
- code: I
  name: 网络科学基础
  weeks: 第 1—4 周
  lecture_hours: 8
  lab_hours: 8
  summary: 认识关系数据、网络结构、经典网络模型与重要节点。
- code: II
  name: 网络结构与行为分析
  weeks: 第 5—8 周
  lecture_hours: 8
  lab_hours: 8
  summary: 分析社区、传播与关系形成，并建立可靠的评估意识。
- code: III
  name: 图机器学习
  weeks: 第 9—12 周
  lecture_hours: 8
  lab_hours: 8
  summary: 从节点嵌入过渡到图神经网络，关注预测任务和验证设计。
- code: IV
  name: 商业应用与综合实践
  weeks: 第 13—16 周
  lecture_hours: 8
  lab_hours: 8
  summary: 将图方法用于知识组织、推荐与风险分析，并完成课程项目。
