projects:
- name: 社交媒体关键用户识别
  question: 哪些用户具有较高的传播价值？
  methods: 中心性、PageRank
- name: 品牌社群分析
  question: 消费者形成了怎样的兴趣群体？
  methods: Louvain、社区发现
- name: 病毒式营销模拟
  question: 如何选择初始营销对象？
  methods: SIR、独立级联
- name: 潜在用户关系预测
  question: 哪些用户可能建立新的联系？
  methods: 链路预测
- name: 电商商品分类
  question: 商品关联关系能否提升分类效果？
  methods: node2vec、GCN
- name: 个性化商品推荐
  question: 如何利用用户行为改进推荐？
  methods: 二部图、协同过滤
- name: 区块链交易风险识别
  question: 网络结构能否辅助识别异常交易？
  methods: 网络特征、GNN
- name: 企业供应链风险分析
  question: 哪些企业具有较高的网络重要性？
  methods: 中心性、连通性
- name: 企业组织网络分析
  question: 组织内部如何进行信息沟通？
  methods: 社区发现、结构洞
- name: 知识图谱构建
  question: 如何组织企业、商品及其关系？
  methods: 实体关系网络
timeline:
- week: 8
  activity: 确定商业问题、小组分工和可获得的数据。
- week: 12
  activity: 检查研究设计、基线、数据划分和初步结果。
- week: 15
  activity: 项目辅导，检查结果解释、局限和复现材料。
- week: 16
  activity: 小组展示、同伴复现与课程总结。
